<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Team Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 15px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .agent-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .agent-card.manager {
            border-left-color: #ef4444;
        }

        .agent-card.planner {
            border-left-color: #3b82f6;
        }

        .agent-card.worker {
            border-left-color: #10b981;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .agent-name {
            font-weight: bold;
            color: #333;
        }

        .agent-role {
            display: inline-block;
            padding: 3px 10px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .agent-role.manager { background: #ef4444; }
        .agent-role.planner { background: #3b82f6; }
        .agent-role.worker { background: #10b981; }

        .agent-status {
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.idle { background: #e5e7eb; color: #666; }
        .status-badge.working { background: #fef3c7; color: #f59e0b; }
        .status-badge.waiting { background: #dbeafe; color: #3b82f6; }
        .status-badge.completed { background: #d1fae5; color: #10b981; }
        .status-badge.error { background: #fee2e2; color: #ef4444; }

        .message-log {
            max-height: 500px;
            overflow-y: auto;
        }

        .message {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
        }

        .message-content {
            color: #333;
            font-size: 14px;
        }

        .message-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }

        .message-type.task { background: #dbeafe; color: #3b82f6; }
        .message-type.question { background: #fef3c7; color: #f59e0b; }
        .message-type.response { background: #d1fae5; color: #10b981; }
        .message-type.status_update { background: #e5e7eb; color: #666; }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 5px;
        }

        .connection-status.disconnected {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                🤖 Agent Team Dashboard
                <span class="status">
                    <span class="connection-status" id="wsStatus"></span>
                    <span id="statusText">Connected</span>
                </span>
                <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
            </h1>
        </header>

        <div class="dashboard-grid">
            <div class="panel">
                <h2>Running Agents</h2>
                <div id="agentsList"></div>
            </div>

            <div class="panel">
                <h2>Collaboration Logs</h2>
                <div class="message-log" id="messageLog"></div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let reconnectInterval;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('wsStatus').classList.remove('disconnected');
                document.getElementById('statusText').textContent = 'Connected';
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'message') {
                    addMessage(data.data);
                    loadAgents();
                } else if (data.type === 'broadcast') {
                    console.log('Broadcast:', data.data);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('wsStatus').classList.add('disconnected');
                document.getElementById('statusText').textContent = 'Disconnected';
                
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connectWebSocket();
                    }, 5000);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        async function loadAgents() {
            try {
                const response = await fetch('/api/agents');
                const data = await response.json();
                displayAgents(data.agents);
            } catch (error) {
                console.error('Error loading agents:', error);
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch('/api/messages?limit=50');
                const data = await response.json();
                displayMessages(data.messages);
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        function displayAgents(agents) {
            const container = document.getElementById('agentsList');
            
            if (agents.length === 0) {
                container.innerHTML = '<p style="color: #666;">No agents running</p>';
                return;
            }

            container.innerHTML = agents.map(agent => `
                <div class="agent-card ${agent.role}">
                    <div class="agent-header">
                        <span class="agent-name">${agent.name}</span>
                        <span class="agent-role ${agent.role}">${agent.role}</span>
                    </div>
                    <div class="agent-status">
                        Status: <span class="status-badge ${agent.status}">${agent.status}</span>
                        ${agent.messageQueue.length > 0 ? `<br>Messages in queue: ${agent.messageQueue.length}` : ''}
                    </div>
                </div>
            `).join('');
        }

        function displayMessages(messages) {
            const container = document.getElementById('messageLog');
            
            if (messages.length === 0) {
                container.innerHTML = '<p style="color: #666;">No messages yet</p>';
                return;
            }

            container.innerHTML = messages.slice(-30).reverse().map(msg => `
                <div class="message">
                    <div class="message-header">
                        <span>
                            <strong>${msg.from}</strong> → <strong>${msg.to}</strong>
                            <span class="message-type ${msg.type}">${msg.type}</span>
                        </span>
                        <span>${new Date(msg.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="message-content">${msg.content}</div>
                </div>
            `).join('');
        }

        function addMessage(message) {
            const container = document.getElementById('messageLog');
            const messageElement = document.createElement('div');
            messageElement.className = 'message pulse';
            messageElement.innerHTML = `
                <div class="message-header">
                    <span>
                        <strong>${message.from}</strong> → <strong>${message.to}</strong>
                        <span class="message-type ${message.type}">${message.type}</span>
                    </span>
                    <span>${new Date(message.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="message-content">${message.content}</div>
            `;
            
            container.insertBefore(messageElement, container.firstChild);
            
            setTimeout(() => {
                messageElement.classList.remove('pulse');
            }, 2000);

            while (container.children.length > 30) {
                container.removeChild(container.lastChild);
            }
        }

        function loadData() {
            loadAgents();
            loadMessages();
        }

        connectWebSocket();
        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
